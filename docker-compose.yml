# =============================================================================
# Networks
# =============================================================================
networks:
  strapi-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mysql-data:
    driver: local
  strapi-uploads:
    driver: local

# =============================================================================
# Shared Strapi environment block
# =============================================================================
x-strapi-env: &strapi-env
  env_file: ./cms-api/.env

# =============================================================================
# Shared Frontend environment block
# =============================================================================
x-front-env: &front-env
  env_file: ./front/.env

# =============================================================================
# Services
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # MySQL Database Service
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:latest
    container_name: strapi_mysql
    restart: unless-stopped
    env_file: ./cms-api/.env
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: pulse_db
      MYSQL_USER: pulse_user
      MYSQL_PASSWORD: pulse_password
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - strapi-network
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Strapi CMS - Development
  # ---------------------------------------------------------------------------
  strapi-dev:
    build:
      context: ./cms-api
      dockerfile: Dockerfile
      target: development # Target the dev stage
    container_name: strapi_dev
    restart: unless-stopped
    <<: *strapi-env
    ports:
      - '1337:1337'
    volumes:
      - ./cms-api:/opt/app # Mount source for hot-reload
      - /opt/app/node_modules # Prevent host node_modules override
      - /opt/app/src/plugins/filtered-articles/node_modules # Keep plugin deps in container
      - strapi-uploads:/opt/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy # Wait for DB to be ready
    networks:
      - strapi-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:1337/_health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

    profiles:
      - dev # Only starts with --profile dev

  # ---------------------------------------------------------------------------
  # Strapi CMS - Production
  # ---------------------------------------------------------------------------
  strapi-prod:
    build:
      context: ./cms-api
      dockerfile: Dockerfile
      target: production # Target the prod stage
    container_name: strapi_prod
    restart: unless-stopped
    <<: *strapi-env
    ports:
      - '1337:1337'
    volumes:
      - strapi-uploads:/opt/app/public/uploads # Persist uploads only
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - strapi-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:1337/_health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

    profiles:
      - prod # Only starts with --profile prod

  # ---------------------------------------------------------------------------
  # Frontend - Development
  # ---------------------------------------------------------------------------
  front-dev:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: development # Target the dev stage
    container_name: front_dev
    restart: unless-stopped
    <<: *front-env
    ports:
      - '3000:3000'
    volumes:
      - ./front:/opt/app # Mount source for hot-reload
      - /opt/app/node_modules # Prevent host node_modules override
      - /opt/app/.next # Keep build cache inside container
    depends_on:
      strapi-dev:
        condition: service_healthy
    networks:
      - strapi-network
    profiles:
      - dev # Only starts with --profile dev

  # ---------------------------------------------------------------------------
  # Frontend - Production
  # ---------------------------------------------------------------------------
  front-prod:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: production # Target the prod stage
      args:
        # NEXT_PUBLIC_* are inlined at BUILD time, so they must be passed here too
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}
        NEXT_PUBLIC_STRAPI_API_TOKEN: ${NEXT_PUBLIC_STRAPI_API_TOKEN}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: front_prod
    restart: unless-stopped
    <<: *front-env
    ports:
      - '3000:3000'
    depends_on:
      strapi-prod:
        condition: service_healthy
    networks:
      - strapi-network
    profiles:
      - prod # Only starts with --profile prod
